services:
  cassandra:
    image: cassandra:5
    container_name: cassandra_db
    hostname: cassandra
    restart: unless-stopped
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M

  cassandra-admin:
    build:
      context: .
    container_name: cassandra_admin
    restart: unless-stopped
    environment:
      - CA_CONNECTION_HOST=cassandra_db
      - CA_CONNECTION_USERNAME=cassandra
      - CA_CONNECTION_PASSWORD=cassandra
    ports:
      - "8002:80"
    init: true
